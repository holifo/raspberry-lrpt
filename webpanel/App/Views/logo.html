{# Raspberry-LRPT v1 logo, drawn inline so it takes the page's text colour (light and dark mode).
   The mark is a METEOR-M2 style satellite (body, two solar wings, the downward LRPT antenna) on an
   orbit in the two satellites' colours, sending its signal down. #}
<svg class="lrpt-logo" viewBox="0 0 382 76" role="img" aria-labelledby="lrpt-logo-title">
  <title id="lrpt-logo-title">Raspberry-LRPT v1</title>
  <g transform="translate(38 36)">
    <!-- orbit, back half -->
    <ellipse rx="34" ry="12.5" transform="rotate(-18)" fill="none" stroke="#4fd1c5" stroke-width="2.4"
             stroke-dasharray="3 4" opacity="0.55"/>
    <!-- solar wings with their cells -->
    <g fill="#f2b33d">
      <rect x="-31" y="-7" width="20" height="12" rx="1.5"/>
      <rect x="11" y="-7" width="20" height="12" rx="1.5"/>
    </g>
    <g stroke="#0b111b" stroke-width="1" opacity="0.55">
      <path d="M-24.3 -7v12M-17.6 -7v12M-31 -1h20M17.7 -7v12M24.4 -7v12M11 -1h20"/>
    </g>
    <path d="M-11 -1h4M7 -1h4" stroke="currentColor" stroke-width="2"/>
    <!-- body and its top dish -->
    <rect x="-7" y="-16" width="14" height="27" rx="3" fill="currentColor"/>
    <rect x="-4.5" y="-12" width="9" height="3" rx="1" fill="#4fd1c5"/>
    <path d="M-5 -16a5 3.2 0 0 1 10 0" fill="none" stroke="currentColor" stroke-width="2"/>
    <!-- LRPT helix antenna and its signal -->
    <path d="M0 11v3.5M-2.6 14.5h5.2M-2.6 17h5.2M-2.6 19.5h5.2" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round"/>
    <g fill="none" stroke="#f2b33d" stroke-width="2" stroke-linecap="round">
      <path d="M-6 25a9 6 0 0 0 12 0" opacity="0.95"/>
      <path d="M-11 29.5a15 8 0 0 0 22 0" opacity="0.6"/>
    </g>
    <!-- orbit, front half, with the second satellite -->
    <path d="M-34 0A34 12.5 0 0 0 34 0" transform="rotate(-18)" fill="none"
          stroke="#4fd1c5" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="-22.3" cy="15.7" r="3.6" fill="#4fd1c5" stroke="#0b111b" stroke-width="1.2"/>
  </g>
  <!-- wordmark -->
  <text x="84" y="44" font-family="-apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="27"
        font-weight="800" textLength="250" lengthAdjust="spacingAndGlyphs" fill="currentColor">RASPBERRY-<tspan fill="#f2b33d">LRPT</tspan></text>
  <g transform="translate(343 21)">
    <rect width="34" height="24" rx="12" fill="#4fd1c5"/>
    <text x="17" y="17" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Arial, sans-serif"
          font-size="15" font-weight="800" fill="#0b111b">v1</text>
  </g>
  <text x="85" y="63" font-family="-apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11.5"
        textLength="268" lengthAdjust="spacing" fill="currentColor" opacity="0.6">METEOR-M2 LRPT GROUND STATION</text>
</svg>
