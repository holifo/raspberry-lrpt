---
# Packages, predict and SatDump. The first install takes a while here; the Pi isn't frozen.
- name: System packages
  become: yes
  apt:
    update_cache: yes
    state: present
    name:
      - at
      - bc
      - build-essential
      - certbot
      - cmake
      - curl
      - direwolf
      - ffmpeg
      - git
      - gmic
      - imagemagick
      - jq
      - pkg-config
      - rsync
      - socat
      - sox
      - sqlite3
      - wget
      - libegl-dev
      - libgfortran5
      - libgles-dev
      - libjpeg-dev
      - libncurses-dev
      - libopenblas-dev
      - libsox-fmt-mp3
      - libsqlite3-dev
      - libtiff-dev
      - libusb-1.0-0
      - libusb-1.0-0-dev
      - "{{ volk_dev_package }}"
      - libxft-dev
      - libxft2
      - zlib1g-dev
      - python3-dev
      - python3-ephem
      - python3-idna
      - python3-jsonschema
      - python3-matplotlib
      - python3-numpy
      - python3-pil
      - fonts-dejavu-core
      - python3-pip
      - python3-pyproj
      - python3-requests
      - python3-setuptools
      - python3-urllib3
      - python3-yaml

- name: Python packages (pip)
  command: pip3 install envbash==1.2.0 --break-system-packages
  register: pip_install
  changed_when: "'Successfully installed' in pip_install.stdout"

# ISS SSTV: sstv_decode.py decodes the ISS's PD modes itself; this package adds the other SSTV
# modes (Robot, Martin, Scottie). Wheels exist for arm64 and amd64 only; --no-deps keeps
# Debian's numpy and Pillow.
- name: SSTV decoder package (pip)
  command: pip3 install sstv==0.2.0 --no-deps --break-system-packages
  register: sstv_install
  changed_when: "'Successfully installed' in sstv_install.stdout"
  failed_when: false
  when: system_architecture != 'armhf'

# predict: the bundled packages, except on a 64-bit PC with a release after Bookworm, where the
# bundled amd64 package (2.2.3) needs ncurses 5, which Trixie doesn't have. There it is built from
# its author's repository (predict 2.2.5) into a .deb.
- name: predict (pass prediction)
  become: yes
  apt:
    deb: "{{ lrpt_home }}/software/{{ predict_debs[system_architecture] }}"
    state: present
  vars:
    predict_debs:
      amd64: predict_2.2.3-4-b2_amd64.deb
      armhf: predict_2.2.5+dfsg.1-1_armhf.deb
      arm64: predict_2.2.5+dfsg.1-1_arm64.deb
  when: not (predict_from_source | bool)

- name: predict built from source
  when: predict_from_source | bool
  block:
    - name: predict check
      command: dpkg-query -W -f=${Version} predict
      register: predict_installed
      changed_when: false
      failed_when: false

    - name: predict package (built from its author's repository)
      when: predict_installed.stdout != predict_build_version
      script: build_predict_deb.sh {{ predict_commit }} {{ predict_build_version }}

    - name: predict package installed
      become: yes
      when: predict_installed.stdout != predict_build_version
      shell: apt-get install -y -q --allow-downgrades /tmp/predict.deb && rm -f /tmp/predict.deb

# SatDump 1.2.3 (stable). The 2.0.0-alpha failed on this station ("A subcommand is required" for
# 'satdump live meteor_m2-x_lrpt ...', and its plugin needs libhdf5_serial_cpp.so.103).
# Any other SatDump package goes first: the 2.x alpha, or Debian's own split packages (Trixie has
# satdump 1.2.2 + satdump-data in its archive), whose files dpkg will not let ours overwrite
# ("trying to overwrite '/usr/include/satdump/...', which is also in package satdump-data").
# Ours is the single package 'satdump' with the deb's own Version.
- name: Other SatDump packages check
  shell: |
    want=$(dpkg-deb -f "{{ lrpt_home }}/software/satdump_{{ satdump_version }}_{{ raspbian_version.stdout }}_{{ system_architecture }}.deb" Version)
    dpkg-query -W -f='${Package}\t${Version}\t${source:Package}\t${db:Status-Status}\n' 2>/dev/null |
      awk -F'\t' -v want="$want" '$4 != "not-installed" && $4 != "config-files" &&
        ($3 == "satdump" || $1 ~ /^(lib)?satdump/) && !($1 == "satdump" && $2 == want) { print $1 }'
  args:
    executable: /bin/bash
  register: satdump_others
  changed_when: false

- name: Other SatDump packages removed
  become: yes
  shell: >
    apt-get remove -y -q {{ satdump_others.stdout_lines | join(' ') }} ||
    dpkg --remove --force-remove-reinstreq --force-depends {{ satdump_others.stdout_lines | join(' ') }}
  when: satdump_others.stdout_lines | length > 0

- name: SatDump {{ satdump_version }}
  become: yes
  apt:
    deb: "{{ lrpt_home }}/software/satdump_{{ satdump_version }}_{{ raspbian_version.stdout }}_{{ system_architecture }}.deb"
    state: present

# Lite images have no ~/.config; it must belong to the user, not root
- name: ~/.config folder
  become: yes
  file:
    path: /home/{{ target_user }}/.config
    state: directory
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: 0700

# MeteorDemod was removed in v1.31.1 (SatDump is the only decoder): one-time clean-up of a
# build left by an earlier install
- name: Old MeteorDemod removed
  become: yes
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/local/bin/meteordemod
    - /home/{{ target_user }}/.config/meteordemod
    - /home/{{ target_user }}/MeteorDemod

# No remote-desktop apps on this station (remote access is SSH only)
- name: Remote-desktop apps check
  command: dpkg-query -W -f=${Status} {{ item }}
  loop: [anydesk, teamviewer, teamviewer-host]
  register: remote_apps
  changed_when: false
  failed_when: false

- name: Remote-desktop apps removed
  become: yes
  apt:
    name: "{{ item.item }}"
    state: absent
    purge: yes
  loop: "{{ remote_apps.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.rc == 0 and 'install ok installed' in item.stdout
