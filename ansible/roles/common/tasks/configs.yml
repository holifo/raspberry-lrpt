---
- name: Station shell settings (~/.raspberry-lrpt.conf)
  template:
    src: raspberry-lrpt.conf.j2
    dest: /home/{{ target_user }}/.raspberry-lrpt.conf
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: 0600

- name: predict folder
  file:
    path: /home/{{ target_user }}/.predict
    state: directory
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: 0755

- name: predict station location
  template:
    src: predict.qth.j2
    dest: /home/{{ target_user }}/.predict/predict.qth
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: 0644

# SatDump's own config must match its version: it holds the instrument and composite
# definitions the products step needs. The old template (written for SatDump 2.x) left those
# out, so SatDump 1.2.3 stopped with "type must be array, but is null" and made no images.
# Keep the packaged file and only set the station location in it.
- name: SatDump config check
  command: grep -q '"viewer"' /usr/share/satdump/satdump_cfg.json
  register: satdump_cfg_check
  changed_when: false
  failed_when: false

- name: SatDump config restored from the package
  become: yes
  shell: >
    dpkg-deb --fsys-tarfile "{{ lrpt_home }}/software/satdump_{{ satdump_version }}_{{ raspbian_version.stdout }}_{{ system_architecture }}.deb"
    | tar -xO ./usr/share/satdump/satdump_cfg.json > /usr/share/satdump/satdump_cfg.json.new
    && mv /usr/share/satdump/satdump_cfg.json.new /usr/share/satdump/satdump_cfg.json
    && chmod 0644 /usr/share/satdump/satdump_cfg.json
  when: satdump_cfg_check.rc != 0

- name: SatDump config - station location
  become: yes
  replace:
    path: /usr/share/satdump/satdump_cfg.json
    regexp: '("{{ item.key }}":\s*\{\s*"type":\s*"float",\s*"value":\s*)[-+0-9.eE]+'
    replace: '\g<1>{{ item.value }}'
  loop:
    - { key: qth_lat, value: "{{ latitude }}" }
    - { key: qth_lon, value: "{{ longitude }}" }
    - { key: qth_alt, value: "{{ altitude }}" }
  loop_control:
    label: "{{ item.key }} = {{ item.value }}"

# Each received channel on its own (geometry corrected) as well as the colour composites.
# SatDump only makes the channels a pass sent; the lookahead keeps this idempotent.
- name: SatDump config - single-channel images
  become: yes
  replace:
    path: /usr/share/satdump/satdump_cfg.json
    regexp: '("msu_mr":\s*\{\s*"handler":\s*"image_handler",\s*"name":\s*"MSU-MR",\s*"rgb_composites":\s*\{)(?!\s*"MSU-MR Channel 1")'
    replace: '\g<1>{% for n in range(1, 7) %}"MSU-MR Channel {{ n }}": {"equation": "ch{{ n }}", "geo_correct": true, "normalize": true}, {% endfor %}'

# Rain likelihood from cloud-top temperature (setting rain_images): two composites with the
# station's own colour table (files/rl1_rain_lut.png, 190-300 K: magenta below -60 C, then red,
# orange, yellow, green down to -15 C, plain IR above). SatDump makes them only when the pass carries
# calibration (the METEORs sent none in 11/2026), so they appear by themselves when it comes back.
# receive_meteor.sh drops the 3.7 um one by day (reflected sunlight).
- name: SatDump rain colour table
  become: yes
  copy:
    src: rl1_rain_lut.png
    dest: /usr/share/satdump/resources/lut/cal/rl1_rain.png
    mode: "0644"

- name: SatDump config - rain likelihood composites
  become: yes
  replace:
    path: /usr/share/satdump/satdump_cfg.json
    regexp: "{{ ('(\"MSU-MR Channel 6\": \\{[^}]*\\}, )(?!\"Rain Likelihood)') if rain_images | default(true) | bool else (rain_composites | regex_escape) }}"
    replace: "{{ ('\\g<1>' ~ rain_composites) if rain_images | default(true) | bool else '' }}"
  vars:
    rain_composites: >-
      "Rain Likelihood (10.8 um)": {"channels": "cch5", "lut": "lut/cal/rl1_rain.png", "geo_correct": true, "calib_cfg": {"cch5": {"type": "temperature", "min": 190, "max": 300}}}, "Rain Likelihood (3.7 um night)": {"channels": "cch4", "lut": "lut/cal/rl1_rain.png", "geo_correct": true, "calib_cfg": {"cch4": {"type": "temperature", "min": 190, "max": 300}}},

# Capital cities' names on the projected (map) images, which are always north up, when
# map_capitals is on. Not on the "_map" swath images: a northbound pass's swath is turned 180°
# after SatDump draws on it, which would put the names upside down. v1.9 added the names to
# every overlay; the first item takes that out again.
- name: SatDump config - capital cities
  become: yes
  replace:
    path: /usr/share/satdump/satdump_cfg.json
    regexp: '{{ item.regexp }}'
    replace: '{{ item.replace }}'
  loop:
    - regexp: ', "draw_cities_overlay": true, "cities_type": 0, "cities_scale_rank": 3, "cities_size": 40'
      replace: ''
      add: any
    - regexp: '("project":\s*\{\s*"draw_map_overlay":\s*true)(?!, "cities_type")'
      replace: '\g<1>, "cities_type": 0, "cities_scale_rank": 3, "cities_size": 24, "draw_cities_overlay": true'
      add: true
    - regexp: ', "cities_type": 0, "cities_scale_rank": 3, "cities_size": 24, "draw_cities_overlay": true'
      replace: ''
      add: false
  when: item.add == 'any' or item.add == (map_capitals | bool)
  loop_control:
    label: "{{ 'remove v1.9 names' if item.add == 'any' else ('add' if item.add else 'remove') }}"

# SatDump updates its own TLEs at every start once they are a day old: it downloads CelesTrak's
# whole "active" list and, when CelesTrak can't be reached, retries 10 times (about 2 min each),
# which held a pass's recording back by up to 20 minutes. schedule.sh already writes SatDump's
# satdump_tles.txt (CelesTrak, else the SatNOGS DB), so SatDump's own update is turned off.
- name: SatDump settings (own TLE download off, city names green)
  become: yes
  become_user: "{{ target_user }}"
  shell: |
    python3 - <<'EOF'
    import json, os
    p = os.path.expanduser('~/.config/satdump/settings.json')
    os.makedirs(os.path.dirname(p), exist_ok=True)
    try:
        cfg = json.load(open(p))
    except Exception:
        cfg = {}
    if not isinstance(cfg, dict):
        cfg = {}
    g = cfg.setdefault('satdump_general', {})
    want = {
        'tle_update_interval': {'value': 'Never'},
        # city names in green on the projected images, the capitals map and the daily maps
        'default_cities_color': {'value': [0.0, 1.0, 0.0]},
    }
    if all(g.get(k) == v for k, v in want.items()):
        print('unchanged')
    else:
        g.update(want)
        json.dump(cfg, open(p, 'w'), indent=4)
        print('changed')
    EOF
  register: satdump_settings
  changed_when: "'changed' in satdump_settings.stdout"

- name: Log folder
  become: yes
  file:
    path: /var/log/raspberry-lrpt
    state: directory
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: 0755

- name: Log file (readable by the Live log page)
  become: yes
  file:
    path: "{{ log_file }}"
    state: touch
    owner: "{{ target_user }}"
    group: www-data
    mode: 0640
    modification_time: preserve
    access_time: preserve

- name: Log rotation
  become: yes
  template:
    src: logrotate-settings.j2
    dest: /etc/logrotate.d/raspberry-lrpt
    owner: root
    group: root
    mode: 0644

- name: Wi-Fi power saving off
  when: disable_wifi_power_mgmt | bool
  become: yes
  block:
    - name: Wi-Fi power saving script and service
      copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: root
        group: root
        mode: "{{ item.mode }}"
      loop:
        - { src: disable-wifi-powermgmt.sh, dest: /usr/local/sbin/disable-wifi-powermgmt.sh, mode: "0755" }
        - { src: disable-wifi-powermgmt.service, dest: /lib/systemd/system/disable-wifi-powermgmt.service, mode: "0644" }
      loop_control:
        label: "{{ item.dest }}"
      register: wifi_powermgmt

    - name: Wi-Fi power saving service enabled
      systemd:
        daemon_reload: yes
        name: disable-wifi-powermgmt.service
        enabled: yes
      when: wifi_powermgmt.changed

- name: Backup and uninstall scripts (~/.rl1_utils)
  copy:
    src: "{{ item }}"
    dest: /home/{{ target_user }}/.rl1_utils/
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: 0755
  loop: [rl1_backup_restore.sh, rl1_uninstall.sh]

- name: Script permissions
  file:
    path: "{{ lrpt_home }}/scripts/{{ item }}"
    state: file
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: 0755
  loop:
    - receive_meteor.sh
    - schedule.sh
    - common.sh
    - tools/scratch_perms.sh
    - tools/verification_tool/verification.sh
