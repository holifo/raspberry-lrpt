---
# Drivers for the receiver chosen at setup (receiver_type). SatDump's own plugins talk to the
# receivers; this adds what each one needs around them: udev rules (so the station user can open
# it), kernel drivers kept off it, tools and, for SDRplay, SDRplay's API and SatDump's plugin.
- name: Receiver family
  set_fact:
    sdr_family: >-
      {{ 'airspy' if receiver_type in ['airspy_mini', 'airspy_r2']
         else ('airspyhf' if receiver_type == 'airspy_hf_plus_discovery' else receiver_type) }}
    satdump_plugins: "/usr/lib/{{ 'aarch64-linux-gnu' if system_architecture == 'arm64' else 'x86_64-linux-gnu' }}/satdump/plugins"

# ---- RTL-SDR -------------------------------------------------------------------------------
- name: RTL-SDR
  when: sdr_family == 'rtlsdr'
  block:
    - name: RTL-SDR kernel driver blacklisted
      become: yes
      copy:
        src: rtlsdr.conf
        dest: /etc/modprobe.d/rtlsdr.conf
        owner: root
        group: root
        mode: 0644
      register: rtlsdr_blacklist

    # The blacklist only stops the DVB-T driver at the next boot (and an initramfs, as on Trixie,
    # can still load it early). A dongle that driver holds streams no samples: SatDump then runs a
    # whole pass on a flat spectrum. So unload it now, and rebuild the initramfs when there is one.
    - name: RTL-SDR kernel driver unloaded
      become: yes
      shell: |
        loaded=$(lsmod | awk '$1 ~ /^(dvb_usb_rtl28xxu|rtl2832_sdr|rtl2832|rtl2830)$/ {print $1}')
        [ -z "$loaded" ] && exit 0
        modprobe -r $loaded || true
        echo unloaded
      register: rtlsdr_unload
      changed_when: "'unloaded' in rtlsdr_unload.stdout"

    - name: RTL-SDR blacklist in the initramfs
      become: yes
      shell: |
        ls /boot/firmware/initramfs* /boot/initrd.img-* >/dev/null 2>&1 || exit 0
        command -v update-initramfs >/dev/null || exit 0
        update-initramfs -u -k all >/dev/null && echo rebuilt
      register: rtlsdr_initramfs
      changed_when: "'rebuilt' in rtlsdr_initramfs.stdout"
      when: rtlsdr_blacklist.changed

    # The RTL-SDR Blog driver (it supports the RTL-SDR Blog V4), built with its own Debian
    # packaging into librtlsdr0 and rtl-sdr packages. The epoch in the version (1:) keeps them
    # ahead of Debian's own librtlsdr, so apt never swaps them back. SatDump's RTL-SDR plugin
    # uses this librtlsdr.so.0.
    - name: RTL-SDR Blog driver check
      command: dpkg-query -W -f=${Version} librtlsdr0
      register: librtlsdr_version
      changed_when: false
      failed_when: false

    - name: RTL-SDR Blog driver (built as .deb packages)
      when: librtlsdr_version.stdout != rtlsdr_blog_version
      block:
        - name: Tools to build the packages
          become: yes
          apt:
            name: [debhelper, dpkg-dev, fakeroot, cmake, libusb-1.0-0-dev, pkg-config]
            state: present

        - name: RTL-SDR Blog source
          shell: |
            set -e
            rm -rf /tmp/rtl-sdr-blog
            git init -q /tmp/rtl-sdr-blog
            cd /tmp/rtl-sdr-blog
            git remote add origin https://github.com/rtlsdrblog/rtl-sdr-blog
            git fetch -q --depth 1 origin {{ rtlsdr_blog_commit }}
            git -c advice.detachedHead=false checkout -q FETCH_HEAD
            {
              printf 'rtl-sdr (%s) unstable; urgency=medium\n\n' "{{ rtlsdr_blog_version }}"
              printf '  * RTL-SDR Blog driver %s, packaged by Raspberry-LRPT.\n\n' "{{ rtlsdr_blog_commit[:7] }}"
              printf ' -- Raspberry-LRPT <raspberry-lrpt@localhost>  %s\n\n' "$(date -R)"
              cat debian/changelog
            } > debian/changelog.new
            mv debian/changelog.new debian/changelog

        - name: RTL-SDR Blog packages built
          command: dpkg-buildpackage -b --no-sign -uc -us
          args:
            chdir: /tmp/rtl-sdr-blog

        - name: RTL-SDR Blog packages installed
          become: yes
          shell: |
            set -e
            cd /tmp
            apt-get install -y -q --allow-downgrades ./librtlsdr0_*.deb ./rtl-sdr_*.deb
            rm -rf /tmp/rtl-sdr-blog /tmp/librtlsdr*.deb /tmp/rtl-sdr_*.deb /tmp/rtl-sdr*.buildinfo /tmp/rtl-sdr*.changes

    # stations from before v1.24.0 had osmocom's build in /usr/local, which would win over the
    # packages (and an old copy of its udev rules)
    - name: Old RTL-SDR build removed (/usr/local)
      become: yes
      shell: |
        found=0
        for f in /usr/local/bin/rtl_* /usr/local/lib/librtlsdr* /usr/local/lib/pkgconfig/librtlsdr.pc \
                 /usr/local/include/rtl-sdr.h /usr/local/include/rtl-sdr_export.h \
                 /etc/udev/rules.d/rtl-sdr.rules /tmp/rtl-sdr; do
          [ -e "$f" ] && { rm -rf "$f"; found=1; }
        done
        [ $found -eq 1 ] && ldconfig && echo removed || true
      register: old_rtlsdr
      changed_when: "'removed' in old_rtlsdr.stdout"

# ---- Airspy (Mini, R2) and Airspy HF+ Discovery --------------------------------------------
- name: Airspy tools
  become: yes
  apt:
    name: "{{ 'airspy' if sdr_family == 'airspy' else 'airspyhf' }}"
    state: present
  when: sdr_family in ['airspy', 'airspyhf']

- name: Airspy kernel driver blacklisted and udev rules
  become: yes
  copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: 0644
  loop:
    - { src: airspy-blacklist.conf, dest: /etc/modprobe.d/airspy-blacklist.conf }
    - { src: 52-airspy.rules, dest: /etc/udev/rules.d/52-airspy.rules }
  loop_control:
    label: "{{ item.dest }}"
  when: sdr_family in ['airspy', 'airspyhf']

# ---- HackRF ---------------------------------------------------------------------------------
# the package brings the hackrf_* tools and libhackrf0's udev rules
- name: HackRF tools
  become: yes
  apt:
    name: hackrf
    state: present
  when: sdr_family == 'hackrf'

# ---- MiriSDR and SDRplay: both are Mirics chips (USB vendor 1df7) ------------------------------
- name: Mirics kernel drivers blacklisted (MiriSDR, SDRplay)
  become: yes
  copy:
    src: blacklist-msi.conf
    dest: /etc/modprobe.d/blacklist-msi.conf
    owner: root
    group: root
    mode: 0644
  when: sdr_family in ['mirisdr', 'sdrplay']

- name: Mirics kernel blacklist removed (other receivers)
  become: yes
  file:
    path: /etc/modprobe.d/blacklist-msi.conf
    state: absent
  when: sdr_family not in ['mirisdr', 'sdrplay']

- name: Mirics kernel drivers unloaded
  become: yes
  command: modprobe -r msi2500 msi001
  changed_when: false
  failed_when: false
  when: sdr_family in ['mirisdr', 'sdrplay']

- name: MiriSDR udev rules
  become: yes
  copy:
    src: 66-mirisdr.rules
    dest: /etc/udev/rules.d/66-mirisdr.rules
    owner: root
    group: root
    mode: 0644
  when: sdr_family == 'mirisdr'

# ---- SDRplay: SDRplay's own API (closed source) and SatDump's plugin for it --------------------
- import_tasks: sdrplay.yml
  when: sdr_family == 'sdrplay'

- name: SDRplay service restart rule removed (other receivers)
  become: yes
  file:
    path: /etc/sudoers.d/040_rl1-sdrplay-restart
    state: absent
  when: sdr_family != 'sdrplay'

- name: Udev rules reloaded
  become: yes
  command: udevadm control --reload-rules
  changed_when: false
  failed_when: false
