---
- name: nginx, PHP and composer
  become: yes
  apt:
    state: present
    name:
      - nginx
      - composer
      - php{{ php_version }}-fpm
      - php{{ php_version }}-intl
      - php{{ php_version }}-mbstring
      - php{{ php_version }}-sqlite3

# The station has no firewall of its own: it sits behind the router, which forwards only the web
# panel's port. Older installs turned UFW on; switch it off and remove it.
- name: Firewall (UFW) off
  become: yes
  shell: |
    command -v ufw >/dev/null || exit 0
    ufw status | grep -q "Status: active" || exit 0
    ufw --force disable >/dev/null && echo disabled
  register: ufw_off
  changed_when: "'disabled' in ufw_off.stdout"

- name: Firewall (UFW) removed
  become: yes
  apt:
    name: ufw
    state: absent
    purge: yes

- name: User in the www-data group
  become: yes
  user:
    name: "{{ target_user }}"
    groups: www-data
    append: yes

- name: Web panel folders
  become: yes
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ target_user }}"
    group: www-data
    mode: 0775
  loop:
    - "{{ web_home }}"
    - "{{ web_home }}/Config"
    - "{{ web_home }}/public"

- name: System time zone
  command: timedatectl show --property=Timezone --value
  register: system_timezone
  changed_when: false

- name: Web panel settings (Config.php)
  become: yes
  template:
    src: Config.php.j2
    dest: "{{ web_home }}/Config/Config.php"
    owner: "{{ target_user }}"
    group: www-data
    mode: 0644

- name: Permissions for the web panel (home, /srv, database)
  become: yes
  file:
    path: "{{ item.path }}"
    owner: "{{ item.owner | default(omit) }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "/home/{{ target_user }}", owner: "{{ target_user }}", group: "{{ target_user }}", mode: "0755" }
    - { path: /srv, owner: "{{ target_user }}", group: www-data, mode: "0755" }
    - { path: "{{ lrpt_home }}/db", group: www-data, mode: "0770" }
    - { path: "{{ lrpt_home }}/db/panel.db", group: www-data, mode: "0770" }
  loop_control:
    label: "{{ item.path }}"

- name: www-data may remove scheduled passes (atrm)
  become: yes
  copy:
    src: 020_www-data-atrm-nopasswd
    dest: /etc/sudoers.d/020_www-data-atrm-nopasswd
    owner: root
    group: root
    mode: 0440

# nginx sites: plain HTTP (default) and/or TLS (default-tls), as enable_non_tls / enable_tls say
- name: nginx sites
  become: yes
  template:
    src: "{{ item.src }}"
    dest: /etc/nginx/sites-available/{{ item.site }}
    owner: root
    group: root
    mode: 0644
  loop:
    - { site: default, src: "nginx_default.j2", enabled: "{{ enable_non_tls | bool }}" }
    - { site: default-tls, src: "nginx_tls_default.j2", enabled: "{{ enable_tls | bool }}" }
  loop_control:
    label: "{{ item.site }}"
  when: item.enabled | bool
  notify: restart nginx

- name: nginx sites enabled
  become: yes
  file:
    src: "{{ ('/etc/nginx/sites-available/' ~ item.site) if item.enabled | bool else omit }}"
    path: /etc/nginx/sites-enabled/{{ item.site }}
    state: "{{ 'link' if item.enabled | bool else 'absent' }}"
  loop:
    - { site: default, enabled: "{{ enable_non_tls | bool }}" }
    - { site: default-tls, enabled: "{{ enable_tls | bool }}" }
  loop_control:
    label: "{{ item.site }} {{ 'on' if item.enabled | bool else 'off' }}"
  notify: restart nginx

- name: nginx running
  become: yes
  service:
    name: nginx
    state: started
