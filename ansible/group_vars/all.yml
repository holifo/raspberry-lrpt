---
# available languages for webpanel (see "Lang" directory files)
available_langs: [ ar, bg, cn, de, en, es, fr, lt, nl, pt, sr, ru, it, hu, kr ]

# root git clone directory (where functionality exists)
lrpt_home: "/home/{{ target_user }}/raspberry-lrpt"

# database file
db_file: "{{ lrpt_home }}/db/panel.db"

# website content directory
web_home: "/var/www/wx-new"

# output root directories for images, audio, and video
output_root: /srv
images_output: "{{ output_root }}/images"
audio_output: "{{ output_root }}/audio"
videos_output: "{{ output_root }}/videos"

# file used for the rolling animation
animation_output: "{{ videos_output }}/RollingAnimation.webm"

# ramfs location
ramfs_path: "/var/ramfs"

# SatDump package bundled in software/ (satdump_<version>_<codename>_<arch>.deb)
satdump_version: "1.2.3-0b654b4ec"
# package names that differ between Debian releases (raspbian_version is the codename)
php_version: "{{ {'bookworm': '8.2', 'trixie': '8.4'}[raspbian_version.stdout] | default('8.2') }}"
volk_dev_package: "{{ 'libvolk2-dev' if raspbian_version.stdout == 'bookworm' else 'libvolk-dev' }}"

# the RTL-SDR Blog driver (RTL-SDR Blog V4 support), built as .deb packages on the station
rtlsdr_blog_commit: "aed0ea19f3a273370a13c9009b96313c75d54c7b"
rtlsdr_blog_version: "1:0.7.0~rtlsdrblog1+git{{ rtlsdr_blog_commit[:7] }}"

# the SatDump commit that deb was built from (the SDRplay plugin is built from its source)
satdump_commit: "0b654b4ec091cae61f357aac3150dd06779d056c"

# SDRplay's API (closed source), installed only for receiver_type: sdrplay
sdrplay_api_version: "3.15.2"
sdrplay_api_url: "https://www.sdrplay.com/software/SDRplay_RSP_API-Linux-{{ sdrplay_api_version }}.run"
sdrplay_api_sha256: "3a97ca764263bbe76fb0f2220e6408942357e8864c19e1408a6d6987af382fe3"

# log output file
log_file: "/var/log/raspberry-lrpt/output.log"

# TLS self-signed certs
tls_cert: /etc/letsencrypt/live/{{ web_server_name }}/fullchain.pem
tls_cert_key: /etc/letsencrypt/live/{{ web_server_name }}/privkey.pem
tls_trusted_certificate: /etc/letsencrypt/live/{{ web_server_name }}/chain.pem
...
