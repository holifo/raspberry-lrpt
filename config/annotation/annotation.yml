# The label on every capture image, drawn by scripts/image_processors/annotation_panel.py.
# Edit it to suit your station.
#
# Layout: the logo (or logo_text) on the left, then the "station" lines, then the "pass" lines,
# each centred in its column, on a light grey 70% transparent panel with rounded corners.
# annotation_width_percent in settings.yml sets its size on the image.
#
# Lines can use {key} for any setting in config/settings.yml (station_title,
# ground_station_location, antenna_information, …) and for these, filled in for each image:
#   sat_name, capture_start, sat_max_elevation, sun_elevation, pass_direction,
#   pass_side ("E"/"W"), pass_side_long ("East"/"West"), enhancement, gain
#
# logo: a square PNG in this folder (e.g. logo.png, 256 px), drawn at 64 px; empty = logo_text.
# font / bold_font / font_size: a TrueType font name (looked up in /usr/share/fonts) and size.

logo: ''
logo_text: LRPT
station:
  - "{station_title}"
  - "{ground_station_location}"
  - "137 MHz {antenna_information} antenna"
pass:
  - "Satellite: {sat_name} | {capture_start}"
  - "Max Elevation: {sat_max_elevation}° {pass_side_long} | Sun Elevation: {sun_elevation}°"
  - "Direction: {pass_direction} | {enhancement} | Gain: {gain}"
font: DejaVuSans.ttf
bold_font: DejaVuSans-Bold.ttf
font_size: 15
